<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Timer App</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <div class="header">
      <h1 class="title">⏱ Timer</h1>
      <div class="tab-bar">
        <button class="tab active" data-tab="timer">タイマー</button>
        <button class="tab" data-tab="stopwatch">ストップウォッチ</button>
      </div>
    </div>

    <!-- Timer Panel -->
    <div id="timer-panel" class="panel active">
      <div class="ring-container">
        <svg class="ring" viewBox="0 0 220 220">
          <circle class="ring-bg" cx="110" cy="110" r="95" />
          <circle class="ring-progress" id="timer-ring" cx="110" cy="110" r="95" />
        </svg>
        <div class="time-display" id="timer-display">00:00</div>
      </div>

      <div class="presets">
        <button class="preset-btn" data-seconds="60">1分</button>
        <button class="preset-btn" data-seconds="180">3分</button>
        <button class="preset-btn" data-seconds="300">5分</button>
        <button class="preset-btn" data-seconds="600">10分</button>
        <button class="preset-btn" data-seconds="1500">25分</button>
      </div>

      <div class="input-row">
        <input type="number" id="timer-input-min" class="time-input" placeholder="分" min="0" max="99" />
        <span class="colon">:</span>
        <input type="number" id="timer-input-sec" class="time-input" placeholder="秒" min="0" max="59" />
        <button class="set-btn" id="timer-set">SET</button>
      </div>

      <div class="controls">
        <button class="ctrl-btn secondary" id="timer-reset">リセット</button>
        <button class="ctrl-btn primary" id="timer-start">スタート</button>
      </div>
    </div>

    <!-- Stopwatch Panel -->
    <div id="stopwatch-panel" class="panel">
      <div class="ring-container">
        <svg class="ring" viewBox="0 0 220 220">
          <circle class="ring-bg" cx="110" cy="110" r="95" />
          <circle class="ring-progress" id="sw-ring" cx="110" cy="110" r="95" />
        </svg>
        <div class="time-display" id="sw-display">00:00<span class="millis">.000</span></div>
      </div>

      <div class="controls">
        <button class="ctrl-btn secondary" id="sw-lap">ラップ</button>
        <button class="ctrl-btn primary" id="sw-start">スタート</button>
        <button class="ctrl-btn secondary" id="sw-reset">リセット</button>
      </div>

      <ul class="lap-list" id="lap-list"></ul>
    </div>
  </div>

  <!-- Alarm overlay -->
  <div class="alarm-overlay hidden" id="alarm-overlay">
    <div class="alarm-box">
      <div class="alarm-icon">🔔</div>
      <p class="alarm-text">時間になりました！</p>
      <button class="ctrl-btn primary" id="alarm-dismiss">OK</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
