<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ポケモン図鑑</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <div class="logo">
        <span class="pokeball-icon"></span>
        <h1>ポケモン図鑑</h1>
      </div>
      <div class="search-wrap">
        <input type="text" id="search" class="search-input" placeholder="名前または番号で検索..." autocomplete="off" />
        <span class="search-icon">&#9906;</span>
      </div>
    </div>
  </header>

  <main class="main">
    <div class="type-filter" id="type-filter">
      <button class="type-chip active" data-type="all">すべて</button>
    </div>

    <div id="pokemon-grid" class="pokemon-grid"></div>

    <div id="loading" class="loading hidden">
      <div class="spinner"></div>
      <p>読み込み中...</p>
    </div>

    <div id="no-result" class="no-result hidden">
      <p>ポケモンが見つかりませんでした</p>
    </div>

    <div class="pagination" id="pagination">
      <button class="page-btn" id="prev-btn" disabled>&#10094; 前へ</button>
      <span class="page-info" id="page-info"></span>
      <button class="page-btn" id="next-btn">次へ &#10095;</button>
    </div>
  </main>

  <!-- Detail Modal -->
  <div class="modal-overlay hidden" id="modal-overlay">
    <div class="modal" id="modal">
      <button class="modal-close" id="modal-close">&#10005;</button>

      <div class="modal-header" id="modal-header">
        <div class="modal-sprites">
          <img id="modal-sprite-front" class="modal-sprite" alt="" />
          <img id="modal-sprite-back" class="modal-sprite" alt="" />
        </div>
        <div class="modal-title-block">
          <span class="modal-number" id="modal-number"></span>
          <h2 class="modal-name" id="modal-name"></h2>
          <p class="modal-ja-name" id="modal-ja-name"></p>
          <div class="modal-types" id="modal-types"></div>
        </div>
      </div>

      <div class="modal-body">
        <div class="modal-info-row">
          <div class="info-box">
            <span class="info-label">たかさ</span>
            <span class="info-value" id="modal-height"></span>
          </div>
          <div class="info-box">
            <span class="info-label">おもさ</span>
            <span class="info-value" id="modal-weight"></span>
          </div>
        </div>

        <div class="section">
          <h3 class="section-title">とくせい</h3>
          <div class="abilities" id="modal-abilities"></div>
        </div>

        <div class="section">
          <h3 class="section-title">基本ステータス</h3>
          <div class="stats" id="modal-stats"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
